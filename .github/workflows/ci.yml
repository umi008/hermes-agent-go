name: ci
on:
  push:
    branches: [main, dev]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...
        env:
          HERMES_GO_DOCKER_TESTS: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}
      - name: build (CGO off)
        shell: bash
        run: CGO_ENABLED=0 go build ./...
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build image
        run: docker build --build-arg VERSION=ci -t hermes-go:ci .
      - name: smoke
        run: |
          test "$(docker run --rm hermes-go:ci version)" = "hermes-go ci"
          docker run --rm hermes-go:ci cron list
          docker run --rm hermes-go:ci cron add --schedule 30m --prompt smoke
